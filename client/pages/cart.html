<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | Lumière Beauty Salon</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="../icon.png">
</head>

<body style="background-color: var(--white);">
    <!-- Navbar -->
    <header>
        <div class="container navbar">
            <a href="/index.html" class="logo">LUMIÈRE</a>
            <ul class="nav-links">
                <li><a href="/index.html">Home</a></li>
                <li><a href="/services.html">Services</a></li>
                <li><a href="/products.html">Products</a></li>
                <li><a href="/contact.html">Contact</a></li>
                <li>
                    <a href="/cart.html" class="cart-icon-link" title="Cart">
                        🛍️
                        <span class="cart-badge" id="cart-count" style="display:none;">0</span>
                    </a>
                </li>
            </ul>
        </div>
    </header>

    <!-- Header Banner -->
    <section class="hero"
        style="height: 30vh; background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1556228578-0d85b1a4d571?q=80&w=1374&auto=format&fit=crop');">
        <div class="hero-content container">
            <h1>Your Beauty Bag</h1>
        </div>
    </section>

    <!-- Cart Items -->
    <section class="container" style="min-height: 40vh;">
        <div id="cart-container" style="max-width: 800px; margin: 0 auto;">
            <!-- Rendered via JS -->
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="footer-bottom" style="border: none; padding-top: 0">
                <p>&copy; 2026 Lumière Beauty Salon. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="/js/main.js"></script>
    <script src="/js/cart.js"></script>
</body>

</html>

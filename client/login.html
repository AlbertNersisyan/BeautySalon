<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Lumière</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="../icon.png">
</head>
<body style="background-color: var(--primary-color);">
    <header>
        <div class="container navbar">
            <a href="/index.html" class="logo">LUMIÈRE LOGIN</a>
            <ul class="nav-links">
                <li><a href="/index.html">Live Site</a></li>
            </ul>
        </div>
    </header>

    <div class="container" style="max-width: 500px; padding: 100px 0;">
        <div style="background: var(--white); padding: 40px; border-radius: 8px; box-shadow: var(--shadow);">
            <h2 style="text-align: center; margin-bottom: 30px;">Admin Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Login</button>
                <div id="login-error" style="color: red; margin-top: 15px; text-align: center; display: none;"></div>
            </form>
        </div>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
